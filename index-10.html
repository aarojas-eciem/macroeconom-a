  <style>
    :root{--ink:#071b33;--blue:#2457e6;--gold:#e7a623;--paper:#fffdf8;--cream:#f4f1e9;--muted:#667486;--line:#d8d9d4;--green:#14836d;--red:#c84b47;--safe:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html{background:var(--ink)}body{margin:0;min-height:100svh;background:var(--ink);color:#fff;font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent;cursor:pointer}.app{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden}.top{height:76px;padding:15px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.12)}.mark{width:38px;height:38px;display:grid;place-items:center;background:var(--gold);color:var(--ink);transform:rotate(45deg)}.mark span{transform:rotate(-45deg);font-size:.9rem;font-weight:800}.brand p{margin:0 0 2px;color:#8cabff;font-size:.62rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.brand strong{font-family:"Libre Caslon Display",serif;font-size:1.12rem;font-weight:400}.counter{margin-left:auto;min-width:54px;text-align:right;color:rgba(255,255,255,.72);font-size:.75rem;font-weight:800}.progress{height:4px;background:rgba(255,255,255,.12)}.progress b{display:block;height:100%;background:var(--gold);transition:width .35s ease}.stage{position:relative;display:flex;align-items:center;justify-content:center;padding:24px 18px 28px}.card{position:relative;width:min(100%,570px);min-height:min(660px,calc(100svh - 170px));display:flex;flex-direction:column;background:var(--paper);color:var(--ink);box-shadow:8px 8px 0 var(--gold);overflow:hidden}.card-inner{flex:1;padding:32px 24px 24px;display:flex;flex-direction:column}.question-no{position:absolute;right:17px;top:8px;color:rgba(7,27,51,.055);font-family:"Libre Caslon Display",serif;font-size:6rem;line-height:1}.eyebrow{position:relative;z-index:1;margin:0 0 15px;color:var(--blue);font-size:.66rem;font-weight:800;letter-spacing:.17em;text-transform:uppercase}.question{position:relative;z-index:1;margin:0 0 24px;font-family:"Libre Caslon Display",serif;font-size:clamp(1.85rem,8vw,2.85rem);line-height:1.06;font-weight:400;letter-spacing:-.025em}.hint{margin:-12px 0 20px;color:var(--muted);font-size:.78rem;line-height:1.5}.options{display:grid;gap:10px}.option{position:relative;width:100%;min-height:60px;display:grid;grid-template-columns:35px 1fr 24px;align-items:center;gap:11px;padding:9px 13px;border:1px solid var(--line);background:#fff;color:var(--ink);text-align:left;font-weight:700;transition:transform .15s,border-color .15s,background .15s}.option:active{transform:scale(.985)}.letter{width:30px;height:30px;display:grid;place-items:center;background:var(--cream);font-size:.72rem;font-weight:800}.tick{color:var(--blue);font-size:1rem;font-weight:800;text-align:center}.option.selected{border:2px solid var(--blue);padding:8px 12px;background:#f2f5ff;box-shadow:0 5px 14px rgba(36,87,230,.08)}.option.selected .letter{background:var(--blue);color:#fff}.word-wrap{display:grid;gap:10px}.word-wrap label{color:var(--muted);font-size:.72rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}.word-wrap input{width:100%;min-height:68px;padding:0 15px;border:2px solid var(--blue);border-radius:0;background:#fff;color:var(--ink);font-family:"Libre Caslon Display",serif;font-size:1.55rem;outline:0}.word-wrap small{color:var(--muted);text-align:right}.nav{margin-top:auto;padding-top:24px;display:grid;grid-template-columns:52px 1fr;gap:10px}.nav button{min-height:54px;border:0;font-weight:800}.back{border:1px solid var(--line)!important;background:#fff;color:var(--ink);font-size:1.15rem}.next{background:var(--blue);color:#fff}.next:disabled{background:#d5d9e0;color:#8b929d;cursor:not-allowed}.micro{margin:15px 0 0;text-align:center;color:var(--muted);font-size:.69rem}.welcome{padding:38px 28px;justify-content:center;background:var(--paper)}.welcome .edition{display:inline-flex;align-self:flex-start;padding:7px 10px;background:var(--gold);font-size:.65rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.welcome h1{margin:25px 0 15px;font-family:"Libre Caslon Display",serif;font-size:clamp(3.3rem,15vw,5.5rem);line-height:.88;font-weight:400;letter-spacing:-.055em}.welcome .lead{margin:0;color:var(--muted);font-size:1rem;line-height:1.6}.welcome .rule{height:1px;margin:30px 0;background:var(--line)}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:28px}.fact{padding:12px 8px;border-left:3px solid var(--blue)}.fact strong{display:block;font-family:"Libre Caslon Display",serif;font-size:1.65rem;font-weight:400}.fact span{color:var(--muted);font-size:.67rem}.start{width:100%;min-height:58px;border:0;background:var(--blue);color:#fff;font-weight:800}.review{gap:18px}.review h1{margin:0;font-family:"Libre Caslon Display",serif;font-size:2.6rem;line-height:1;font-weight:400}.review>p{margin:0;color:var(--muted);line-height:1.55}.review-list{display:grid;gap:8px;max-height:330px;overflow:auto;padding-right:3px}.review-item{display:grid;grid-template-columns:31px 1fr auto;align-items:center;gap:10px;padding:11px;border:1px solid var(--line);background:#fff}.review-item>span{width:28px;height:28px;display:grid;place-items:center;background:var(--cream);font-size:.7rem;font-weight:800}.review-item p{margin:0;font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.review-item small{display:block;margin-top:2px;color:var(--muted);font-weight:600}.edit{border:0;background:transparent;color:var(--blue);font-size:.72rem;font-weight:800}.send{width:100%;min-height:58px;border:0;background:var(--green);color:#fff;font-weight:800}.send:disabled{opacity:.5}.status{padding:38px 28px;justify-content:center;align-items:center;text-align:center}.status-icon{width:78px;height:78px;display:grid;place-items:center;border-radius:50%;background:var(--green);color:#fff;font-size:2rem;box-shadow:0 0 0 13px rgba(20,131,109,.1)}.status h1{margin:32px 0 10px;font-family:"Libre Caslon Display",serif;font-size:2.8rem;line-height:1;font-weight:400}.status p{max-width:380px;margin:0;color:var(--muted);line-height:1.6}.retry{margin-top:24px;min-height:50px;padding:0 20px;border:0;background:var(--blue);color:#fff;font-weight:800}.footer{min-height:46px;padding:8px 18px calc(8px + var(--safe));display:flex;align-items:center;justify-content:space-between;color:rgba(255,255,255,.52);font-size:.63rem;letter-spacing:.08em;text-transform:uppercase}.hidden{display:none!important}iframe{display:none}@media(min-width:680px){.top{padding-inline:30px}.stage{padding:32px}.card-inner{padding:40px}.card{box-shadow:12px 12px 0 var(--gold)}}@media(max-height:720px){.stage{align-items:flex-start}.card{min-height:auto}.question{font-size:1.8rem}.option{min-height:52px}.card-inner{padding-top:25px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

  <style>
    /* Dirección visual moderna: app móvil, tipografía sans y profundidad suave */
    :root{--ink:#091126;--blue:#596cff;--gold:#43e1c2;--paper:#ffffff;--cream:#f4f6ff;--muted:#687089;--line:#e5e8f2;--green:#12a985;--red:#ef5b65}
    body{background:linear-gradient(160deg,#091126 0%,#111d42 56%,#18295a 100%);font-family:"DM Sans",sans-serif}
    .app{position:relative;background:radial-gradient(circle at 15% 15%,rgba(89,108,255,.26),transparent 29%),radial-gradient(circle at 90% 80%,rgba(67,225,194,.15),transparent 30%)}
    .app:before,.app:after{content:"";position:fixed;pointer-events:none;border-radius:999px;filter:blur(2px)}
    .app:before{width:180px;height:180px;right:-95px;top:145px;border:1px solid rgba(255,255,255,.1);box-shadow:0 0 0 24px rgba(255,255,255,.025),0 0 0 52px rgba(255,255,255,.018)}
    .app:after{width:120px;height:120px;left:-78px;bottom:85px;background:rgba(67,225,194,.09)}
    .top{height:78px;padding:16px 20px;border:0;background:rgba(9,17,38,.48);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--blue),#8f59ff);box-shadow:0 8px 22px rgba(89,108,255,.35);transform:none}
    .mark span{transform:none;color:#fff;font-size:1rem}
    .brand p{color:#8fa2ff;font-size:.6rem;letter-spacing:.18em}
    .brand strong{font-family:"DM Sans",sans-serif;font-size:1.02rem;font-weight:800;letter-spacing:-.025em}
    .counter{width:auto;min-width:58px;padding:7px 11px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:rgba(255,255,255,.06);text-align:center;color:#fff;font-size:.7rem}
    .progress{height:3px;background:rgba(255,255,255,.08)}
    .progress b{border-radius:0 999px 999px 0;background:linear-gradient(90deg,var(--blue),var(--gold));box-shadow:0 0 14px rgba(67,225,194,.35)}
    .stage{z-index:1;padding:20px 15px 26px}
    .card{min-height:min(680px,calc(100svh - 164px));border:1px solid rgba(255,255,255,.65);border-radius:28px;background:rgba(255,255,255,.97);box-shadow:0 26px 80px rgba(0,0,0,.3),inset 0 1px 0 #fff;animation:cardIn .35s cubic-bezier(.2,.75,.2,1);overflow:hidden}
    @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    .card-inner{padding:30px 22px 22px}
    .question-no{right:18px;top:17px;width:48px;height:48px;display:grid;place-items:center;border-radius:15px;background:#f0f2ff;color:var(--blue);font-family:"DM Sans",sans-serif;font-size:.78rem;font-weight:800;line-height:1}
    .eyebrow{margin-bottom:14px;color:var(--blue);font-size:.62rem;letter-spacing:.17em}
    .question{max-width:94%;margin-bottom:25px;font-family:"DM Sans",sans-serif;font-size:clamp(1.75rem,7.7vw,2.7rem);line-height:1.08;font-weight:800;letter-spacing:-.045em;text-wrap:balance}
    .hint{margin-top:-11px;color:var(--muted)}
    .options{gap:10px}
    .option{min-height:62px;grid-template-columns:38px 1fr 25px;gap:11px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:#f8f9fd;font-size:.88rem;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease,background .18s ease}
    .option:hover{border-color:#cfd5fa;background:#fff}
    .option:active{transform:scale(.975)}
    .letter{width:32px;height:32px;border-radius:10px;background:#e9ecf5;color:#6b7288}
    .option.selected{border:2px solid var(--blue);padding:9px 13px;background:linear-gradient(135deg,#f1f3ff,#f8f7ff);box-shadow:0 9px 24px rgba(89,108,255,.13)}
    .option.selected .letter{background:linear-gradient(135deg,var(--blue),#825dff);box-shadow:0 5px 12px rgba(89,108,255,.25)}
    .tick{font-size:1.1rem}
    .word-wrap label{color:#7a8196;font-size:.65rem}
    .word-wrap input{min-height:66px;border:2px solid #dfe3f3;border-radius:16px;background:#f8f9fd;font-family:"DM Sans",sans-serif;font-size:1.2rem;font-weight:700;transition:border-color .2s,box-shadow .2s}
    .word-wrap input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 5px rgba(89,108,255,.1)}
    .nav{grid-template-columns:56px 1fr;gap:11px;padding-top:22px}
    .nav button{min-height:56px;border-radius:16px}
    .back{border:1px solid var(--line)!important;border-radius:16px;background:#f5f6fa;color:#525b73}
    .next{border:0;background:linear-gradient(135deg,var(--blue),#795fff);box-shadow:0 12px 25px rgba(89,108,255,.28)}
    .next:not(:disabled):active,.start:active,.send:active{transform:scale(.98)}
    .next:disabled{background:#e7e9ef;color:#a4a9b5;box-shadow:none}
    .micro{color:#8a91a5;font-size:.65rem}
    .welcome{position:relative;padding:34px 25px;justify-content:center;background:linear-gradient(145deg,#fff 0%,#f8f9ff 100%)}
    .welcome:before{content:"";position:absolute;width:170px;height:170px;right:-75px;top:-65px;border-radius:50%;background:linear-gradient(135deg,rgba(89,108,255,.14),rgba(67,225,194,.15))}
    .welcome .edition{position:relative;align-self:flex-start;padding:8px 11px;border:1px solid #dfe3ff;border-radius:999px;background:#f0f2ff;color:var(--blue);font-size:.61rem}
    .welcome h1{position:relative;margin:25px 0 16px;font-family:"DM Sans",sans-serif;font-size:clamp(3rem,13vw,5rem);line-height:.9;font-weight:800;letter-spacing:-.075em;text-wrap:balance}
    .welcome .lead{font-size:.94rem;line-height:1.65}
    .welcome .rule{margin:27px 0;background:linear-gradient(90deg,var(--line),transparent)}
    .facts{gap:8px;margin-bottom:25px}
    .fact{padding:12px 8px;border:0;border-radius:14px;background:#f1f3f9;text-align:center}
    .fact strong{font-family:"DM Sans",sans-serif;font-size:1.35rem;font-weight:800;letter-spacing:-.04em}
    .fact span{font-size:.61rem}
    .start{min-height:58px;border-radius:17px;background:linear-gradient(135deg,var(--blue),#7b5cff);box-shadow:0 14px 28px rgba(89,108,255,.28);transition:transform .18s}
    .review{gap:16px}
    .review h1{font-family:"DM Sans",sans-serif;font-size:2.25rem;font-weight:800;letter-spacing:-.06em}
    .review-list{gap:8px}
    .review-item{grid-template-columns:34px 1fr auto;padding:11px;border:1px solid var(--line);border-radius:14px;background:#f8f9fd}
    .review-item>span{width:30px;height:30px;border-radius:9px;background:#e9ecff;color:var(--blue)}
    .edit{padding:7px 8px;border-radius:8px;background:#eef0ff}
    .send{min-height:58px;border-radius:17px;background:linear-gradient(135deg,var(--green),#22c7a5);box-shadow:0 12px 25px rgba(18,169,133,.23)}
    .status{padding:38px 26px;background:linear-gradient(145deg,#fff,#f7f9ff)}
    .status-icon{background:linear-gradient(135deg,var(--green),#28c9a9);box-shadow:0 0 0 13px rgba(18,169,133,.1),0 16px 30px rgba(18,169,133,.2)}
    .status h1{font-family:"DM Sans",sans-serif;font-size:2.35rem;font-weight:800;letter-spacing:-.06em}
    .retry{border-radius:15px;background:linear-gradient(135deg,var(--blue),#795fff)}
    .footer{z-index:1;color:rgba(255,255,255,.5)}
    @media(min-width:680px){.card{border-radius:32px;box-shadow:0 28px 90px rgba(0,0,0,.34)}.card-inner{padding:38px 36px 28px}}
    @media(max-height:720px){.card{min-height:auto}.question{font-size:1.65rem}.option{min-height:52px}.card-inner{padding-top:23px}}
  </style>
</head>
<body>
  <main class="app">
    <div><header class="top"><div class="mark"><span>Δ</span></div><div class="brand"><p>Macroeconomía I</p><strong>Chile bajo presión</strong></div><span class="counter" id="counter"></span></header><div class="progress"><b id="progress"></b></div></div>
    <section class="stage"><article class="card" id="card"></article></section>
    <footer class="footer"><span>Votación anónima</span><strong>UCN · ECIEM</strong></footer>
  </main>
  <form id="postForm" method="post" target="postTarget"><input type="hidden" name="payload" id="payload"></form><iframe name="postTarget"></iframe>
  <script>
  const QUESTIONS=[
    {id:'q1',kicker:'Punto de partida',prompt:'Sin buscar datos: ¿cómo describirías hoy la economía chilena?',type:'choice',options:['Muy bien','Bien','Regular','Mal','Muy mal']},
    {id:'q2',kicker:'El tablero del país',prompt:'¿Cuál es el mejor indicador para saber si una economía está bien?',type:'choice',options:['Crecimiento del PIB','Inflación','Empleo','Salarios','Distribución del ingreso','Calidad de vida']},
    {id:'q3',kicker:'Bolsillo real',prompt:'Tu sueldo aumenta 5%, pero los precios suben 8%. ¿Estás mejor o peor?',type:'choice',options:['Mejor: mi sueldo aumentó','Igual que antes','Peor: perdí poder de compra','Depende de lo que consumo']},
    {id:'q4',kicker:'Decisión bajo presión',prompt:'La inflación llega a 10%. ¿Qué medida tomarías primero?',type:'choice',options:['Subir la tasa de interés','Congelar los precios','Entregar bonos','Reducir impuestos','Esperar sin intervenir']},
    {id:'q5',kicker:'El costo del dinero',prompt:'El Banco Central sube la tasa de interés. ¿Qué decisión tomarías tú?',type:'choice',options:['Ahorraría más','Pediría un crédito','Postergaría una compra','Reduciría mis gastos','No cambiaría nada']},
    {id:'q6',kicker:'Ganadores y perdedores',prompt:'El dólar aumenta fuertemente. Para Chile, ¿es una buena o una mala noticia?',type:'choice',options:['Buena','Mala','Depende de quién se analice','Falta información']},
    {id:'q7',kicker:'El dilema',prompt:'La inflación baja, pero el desempleo sube a 11%. ¿Qué priorizarías?',type:'choice',options:['Seguir bajando la inflación','Crear empleos de emergencia','Bajar la tasa de interés','Reducir impuestos a empresas','No decidiría sin más datos']},
    {id:'q8',kicker:'Más allá del promedio',prompt:'El PIB crece 4%, pero los salarios se estancan y la contaminación aumenta. ¿El país está mejor?',type:'choice',options:['Sí','No','Depende','No hay información suficiente']},
    {id:'q9',kicker:'Tu definición',prompt:'En una palabra: ¿qué debería priorizar una economía que funciona bien?',type:'word'}
  ];
  const DEFAULT_API='https://script.google.com/macros/s/AKfycbyfXFJsMrV6-cVP2_fs3P9-uG5BVSTyYiUyqBZ3-L5FP4jdcwywU6zVut5i7wWeZ54jMQ/exec';
  const params=new URLSearchParams(location.search),API=(params.get('api')||DEFAULT_API).trim(),SESSION=(params.get('session')||'MACRO-I').toUpperCase();
  const card=document.getElementById('card'),counter=document.getElementById('counter'),progress=document.getElementById('progress');
  let screen='welcome',current=0,answers={},sending=false,error='';
  try{const draft=JSON.parse(sessionStorage.getItem('macro-vote-draft-'+SESSION)||'{}');if(draft.answers){answers=draft.answers;current=draft.current||0}}
  catch(_){answers={}}
  function saveDraft(){sessionStorage.setItem('macro-vote-draft-'+SESSION,JSON.stringify({answers,current}))}
  function fingerprint(){let id=localStorage.getItem('macro-voter-id');if(!id){id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random());localStorage.setItem('macro-voter-id',id)}return id}
  function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
  function updateChrome(){if(screen==='question'){counter.textContent=(current+1)+' / '+QUESTIONS.length;progress.style.width=((current+1)/QUESTIONS.length*100)+'%'}else if(screen==='review'){counter.textContent='Revisión';progress.style.width='100%'}else{counter.textContent='';progress.style.width=screen==='done'?'100%':'0%'}}
  function render(){updateChrome();if(screen==='welcome')return renderWelcome();if(screen==='question')return renderQuestion();if(screen==='review')return renderReview();if(screen==='sending'||screen==='done'||screen==='error')return renderStatus()}
  function renderWelcome(){card.className='card card-inner welcome';card.innerHTML='<span class="edition">Experiencia inicial</span><h1>La economía está en tus manos.</h1><p class="lead">Nueve decisiones. No buscamos respuestas perfectas: queremos conocer cómo piensas antes de comenzar el curso.</p><div class="rule"></div><div class="facts"><div class="fact"><strong>9</strong><span>decisiones</span></div><div class="fact"><strong>4</strong><span>minutos</span></div><div class="fact"><strong>100%</strong><span>anónimo</span></div></div><button class="start" id="start">Comenzar votación</button>';document.getElementById('start').onclick=()=>{screen='question';render()}}
  function renderQuestion(){const q=QUESTIONS[current],answer=answers[q.id]||'';card.className='card';const choices=q.type==='choice'?'<div class="options">'+q.options.map((o,i)=>'<button type="button" class="option'+(answer===o?' selected':'')+'" data-answer="'+escapeHtml(o)+'"><span class="letter">'+String.fromCharCode(65+i)+'</span><span>'+escapeHtml(o)+'</span><i class="tick">'+(answer===o?'✓':'')+'</i></button>').join('')+'</div>':'<div class="word-wrap"><label for="wordInput">Escribe una sola palabra</label><input id="wordInput" maxlength="30" placeholder="Ej.: bienestar" value="'+escapeHtml(answer)+'"><small id="charCount">'+answer.length+' / 30</small></div>';card.innerHTML='<div class="question-no">'+String(current+1).padStart(2,'0')+'</div><div class="card-inner"><p class="eyebrow">'+escapeHtml(q.kicker)+'</p><h1 class="question">'+escapeHtml(q.prompt)+'</h1>'+(q.type==='word'?'<p class="hint">La primera palabra que se te venga a la mente.</p>':'')+choices+'<div class="nav"><button class="back" id="back" aria-label="Volver">←</button><button class="next" id="next" '+(answer?'':'disabled')+'>'+(current===QUESTIONS.length-1?'Revisar respuestas':'Continuar')+'</button></div><p class="micro">Puedes volver y cambiar cualquier respuesta antes de enviar.</p></div>';card.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>{answers[q.id]=btn.dataset.answer;saveDraft();renderQuestion()});const input=document.getElementById('wordInput');if(input){input.oninput=e=>{answers[q.id]=e.target.value.replace(/\s+/g,' ');saveDraft();document.getElementById('charCount').textContent=answers[q.id].length+' / 30';document.getElementById('next').disabled=!answers[q.id].trim()}}document.getElementById('back').onclick=()=>{if(current===0)screen='welcome';else current--;saveDraft();render()};document.getElementById('next').onclick=()=>{if(!String(answers[q.id]||'').trim())return;if(current===QUESTIONS.length-1)screen='review';else current++;saveDraft();render();window.scrollTo(0,0)}}
  function renderReview(){card.className='card';const items=QUESTIONS.map((q,i)=>'<div class="review-item"><span>'+String(i+1).padStart(2,'0')+'</span><p>'+escapeHtml(q.kicker)+'<small>'+escapeHtml(answers[q.id]||'Sin respuesta')+'</small></p><button class="edit" data-edit="'+i+'">Editar</button></div>').join('');card.innerHTML='<div class="card-inner review"><p class="eyebrow">Último paso</p><h1>Revisa tus decisiones.</h1><p>Cuando envíes, tus respuestas quedarán registradas como un solo voto anónimo.</p><div class="review-list">'+items+'</div><button class="send" id="send">Enviar mis 9 respuestas</button><button class="back" id="reviewBack">← Volver a la última pregunta</button></div>';card.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.edit);screen='question';render()});document.getElementById('reviewBack').onclick=()=>{current=QUESTIONS.length-1;screen='question';render()};document.getElementById('send').onclick=submitAll}
  function renderStatus(){card.className='card card-inner status';if(screen==='sending'){card.innerHTML='<div class="dots" style="display:flex;gap:9px"><i style="width:15px;height:15px;background:var(--gold)"></i><i style="width:15px;height:15px;background:var(--gold)"></i><i style="width:15px;height:15px;background:var(--gold)"></i></div><h1>Registrando tus decisiones…</h1><p>Estamos comprobando que las nueve respuestas queden guardadas correctamente.</p>';return}if(screen==='done'){card.innerHTML='<div class="status-icon">✓</div><h1>Votación completada.</h1><p>Tus nueve respuestas quedaron registradas. Ahora vuelve a mirar la pantalla de la clase.</p>';return}card.innerHTML='<div class="status-icon" style="background:var(--red)">!</div><h1>No pudimos confirmar el envío.</h1><p>'+escapeHtml(error||'Revisa tu conexión e intenta nuevamente.')+'</p><button class="retry" id="retry">Volver a intentar</button>';document.getElementById('retry').onclick=()=>{screen='review';render()}}
  function jsonp(mode,extra={}){return new Promise((resolve,reject)=>{const cb='macro_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),timer=setTimeout(()=>done(new Error('Tiempo agotado')),10000);function done(err){clearTimeout(timer);s.remove();delete window[cb];if(err)reject(err)}window[cb]=data=>{done();resolve(data)};s.src=API+'?'+new URLSearchParams({mode,session:SESSION,callback:cb,_:Date.now(),...extra});s.onerror=()=>done(new Error('Sin conexión'));document.body.appendChild(s)})}
  function post(payload){const form=document.getElementById('postForm');form.action=API;document.getElementById('payload').value=JSON.stringify(payload);form.submit()}
  async function confirmBatch(fp){for(let i=0;i<8;i++){await new Promise(r=>setTimeout(r,700));try{const data=await jsonp('confirmBatch',{fingerprint:fp,expected:String(QUESTIONS.length)});if(data.ok&&data.received)return true}catch(_){}}return false}
  async function submitAll(){if(sending)return;if(QUESTIONS.some(q=>!String(answers[q.id]||'').trim())){current=QUESTIONS.findIndex(q=>!String(answers[q.id]||'').trim());screen='question';render();return}if(!API){error='Esta versión aún no tiene configurada la conexión con Google Sheets.';screen='error';render();return}sending=true;screen='sending';render();const fp=fingerprint(),votes=QUESTIONS.map(q=>({questionId:q.id,answer:String(answers[q.id]).trim()}));post({kind:'batchVote',session:SESSION,fingerprint:fp,votes,createdAt:new Date().toISOString()});const received=await confirmBatch(fp);sending=false;if(received){sessionStorage.removeItem('macro-vote-draft-'+SESSION);localStorage.setItem('macro-completed-'+SESSION,'1');screen='done'}else{error='No pudimos comprobar las nueve respuestas en la hoja. Intenta nuevamente.';screen='error'}render()}
  render();
  </script>
</body>
