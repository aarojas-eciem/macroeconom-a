    /* ===== TEMA CLARO · optimizado para proyección en data ===== */
    :root{
      --ink:#12213d;
      --panel:#ffffff;
      --panel2:#f4f7fb;
      --blue:#485cff;
      --violet:#7652e8;
      --cyan:#078f7b;
      --gold:#b97700;
      --red:#d43e4e;
      --white:#12213d;
      --muted:#64748b;
      --line:#dbe3ee;
      --shadow:0 16px 44px rgba(29,48,79,.10);
    }

    body{background:#fff;color:var(--ink)}
    .deck{
      background:
        radial-gradient(circle at 7% 8%,rgba(72,92,255,.075),transparent 26%),
        radial-gradient(circle at 94% 88%,rgba(7,143,123,.055),transparent 25%),
        linear-gradient(145deg,#ffffff,#f7f9fd 58%,#eef3f9);
    }
    .deck:before{
      opacity:.55;
      background-image:
        linear-gradient(rgba(18,33,61,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(18,33,61,.025) 1px,transparent 1px);
    }

    .topbar,.bottombar{
      background:rgba(255,255,255,.88);
      border-color:var(--line);
      backdrop-filter:blur(18px);
    }
    .brand p{color:#5264d9}
    .brand strong{color:var(--ink)}
    .mark{
      color:#fff;
      box-shadow:0 8px 20px rgba(72,92,255,.18);
    }
    .live{background:#fff;border-color:var(--line);color:var(--muted)}
    .live.ok{color:#087b6c}
    .metric-top strong{color:var(--ink)}

    .hero{
      background:linear-gradient(145deg,#ffffff,#f4f7fc);
      border-color:var(--line);
      box-shadow:var(--shadow);
    }
    .hero:after{
      border-color:rgba(18,33,61,.10);
      box-shadow:0 0 0 48px rgba(72,92,255,.025),0 0 0 98px rgba(72,92,255,.015);
    }
    .tag{
      background:#eef1ff;
      color:#4354c7;
      border-color:#ccd4ff;
    }
    .hero h1{color:var(--ink)}
    .hero p{color:#5e6f88}
    .start-btn{color:#fff;box-shadow:0 10px 24px rgba(72,92,255,.18)}

    .stat{
      background:#fff;
      border-color:var(--line);
      box-shadow:0 12px 34px rgba(29,48,79,.07);
    }
    .stat span,.stat small{color:var(--muted)}
    .stat strong{color:var(--ink)}
    .stat.accent{
      background:linear-gradient(145deg,#5265ff,#7257db);
      border-color:transparent;
    }
    .stat.accent strong{color:#fff}
    .stat.accent span,.stat.accent small{color:rgba(255,255,255,.82)}

    .question-card,.results-card,.debate-card,
    .summary-score,.summary-list{
      background:rgba(255,255,255,.96);
      border-color:var(--line);
      box-shadow:0 14px 38px rgba(29,48,79,.08);
    }
    .question-card:after{color:rgba(18,33,61,.035)}
    .q-kicker,.summary-list>p{color:#5264d9}
    .question-card h2,.result-head h3,
    .summary-score h2,.summary-list h3{color:var(--ink)}
    .concept{border-color:var(--line)}
    .concept span,.assessment small,.summary-item small{color:var(--muted)}
    .concept strong{color:var(--ink)}
    .reference{
      background:#eef2ff;
      color:#3446a8;
      border:1px solid #dce2ff;
    }

    .result-head{border-color:var(--line)}
    .result-head p{color:#087b6c}
    .answer-total{
      background:#f8fafc;
      color:#64748b;
      border-color:var(--line);
    }
    .bar-label span,.bar-label strong{color:var(--ink)}
    .bar-row small{color:#64748b}
    .rail{background:#e8edf4}
    .bar-row.majority .rail b{box-shadow:none}

    .assessment{
      background:#f7f9fc;
      border-color:var(--line);
    }
    .assessment h4,.assessment .majority-value,.assessment p strong{color:var(--ink)}
    .assessment p{color:#64748b}
    .assessment.aligned .assessment-icon{background:#dff6f0;color:#087b6c}
    .assessment.review .assessment-icon{background:#fde9ec;color:#c93647}
    .assessment.neutral .assessment-icon,
    .assessment.waiting .assessment-icon{background:#fff1cf;color:#a96500}

    .debate-card{
      background:linear-gradient(110deg,#f1f3ff,#ffffff);
    }
    .debate-card span{color:#5264d9}
    .debate-card p{color:var(--ink)}
    .debate-icon{color:#fff}

    .cloud .empty,.empty{color:var(--muted)}

    .summary-score .big{
      background:linear-gradient(135deg,#087b6c,#12a78e);
      -webkit-background-clip:text;
      color:transparent;
    }
    .summary-score p{color:var(--muted)}
    .summary-item{
      background:#fafbfd;
      border-color:var(--line);
    }
    .summary-item strong,.summary-item b{color:var(--ink)}
    .summary-item.aligned>span{background:#dff6f0;color:#087b6c}
    .summary-item.review>span{background:#fde9ec;color:#c93647}
    .summary-item.waiting>span{background:#fff1cf;color:#a96500}

    .slide-label{color:#64748b}
    .dot{background:#c7d0dc}
    .dot.active{background:linear-gradient(90deg,var(--blue),#078f7b)}
    .control{
      background:#fff;
      color:var(--ink);
      border-color:#d5deea;
      box-shadow:0 2px 7px rgba(29,48,79,.04);
    }
    .control:hover{background:#f2f5f9}

    @media (prefers-color-scheme:dark){
      body{background:#fff;color:var(--ink)}
    }

  </style>
</head>

      {id:'q4',kicker:'Decisión bajo presión',prompt:'La inflación llega a 10%. ¿Qué medida tomarías primero?',options:['Subir la tasa de interés','Congelar los precios','Entregar bonos','Reducir impuestos','Esperar sin intervenir'],concept:'Inflación y política económica',aligned:['Subir la tasa de interés'],reference:'Referencia: subir la tasa es la respuesta monetaria habitual frente a inflación persistente.',debate:'¿Qué costo puede tener controlar la inflación mediante una tasa de interés más alta?',insight:'Una medida puede contener la inflación y, al mismo tiempo, enfriar la actividad.'},
      {id:'q5',kicker:'El costo del dinero',prompt:'El Banco Central sube la tasa de interés. ¿Qué decisión tomarías tú?',options:['Ahorraría más','Pediría un crédito','Postergaría una compra','Reduciría mis gastos','No cambiaría nada'],concept:'Transmisión monetaria',aligned:['Ahorraría más','Postergaría una compra','Reduciría mis gastos'],reference:'Son coherentes ahorrar más, postergar compras o reducir gastos.',debate:'¿Cómo una decisión del Banco Central termina afectando el consumo de una familia?',insight:'La tasa actúa mediante el crédito, el ahorro, el consumo y la inversión.'},
      {id:'q6',kicker:'Ganadores y perdedores',prompt:'El dólar aumenta fuertemente. Para Chile, ¿es una buena o una mala noticia?',options:['Buena','Mala','Depende de quién se analice','Falta información'],concept:'Tipo de cambio',aligned:['Depende de quién se analice'],reference:'Referencia: depende del actor, su actividad y su exposición al exterior.',debate:'¿Quién gana y quién pierde si el peso chileno se deprecia?',insight:'Un mismo movimiento puede beneficiar exportadores y encarecer importaciones.'},
      {id:'q7',kicker:'El dilema',prompt:'La inflación baja, pero el desempleo sube a 11%. ¿Qué priorizarías?',options:['Seguir bajando la inflación','Crear empleos de emergencia','Bajar la tasa de interés','Reducir impuestos a empresas','No decidiría sin más datos'],concept:'Inflación, empleo y actividad',aligned:null,reference:'No existe una única respuesta: hay objetivos y costos en tensión.',debate:'¿Qué costo aceptarías, para quiénes y durante cuánto tiempo?',insight:'La política económica obliga a priorizar objetivos que pueden entrar en conflicto.'},
      {id:'q8',kicker:'Más allá del promedio',prompt:'El PIB crece 4%, pero los salarios se estancan y la contaminación aumenta. ¿El país está mejor?',options:['Sí','No','Depende','No hay información suficiente'],concept:'Crecimiento y bienestar',aligned:['Depende','No hay información suficiente'],reference:'Referencia: el crecimiento del PIB no basta para concluir que aumentó el bienestar.',debate:'¿Qué dimensiones importantes para vivir mejor quedan fuera del PIB?',insight:'El PIB mide producción, no resume distribución, sostenibilidad ni bienestar.'},
      {id:'q9',kicker:'Tu definición',prompt:'En una palabra: ¿qué debería priorizar una economía que funciona bien?',type:'word',concept:'Síntesis del curso',aligned:null,reference:'Pregunta abierta: la nube muestra las prioridades espontáneas del curso.',debate:'¿Es posible alcanzar simultáneamente todas las prioridades que aparecen?',insight:'Definir una economía que funciona implica elegir objetivos sociales.'}
    ];
    const COLORS=['#6172ff','#9765ff','#44dec2','#ffc857','#ff6874','#53a7ff'];
    let rows=[],participants=0,connected=false,current=0,lastUpdated=null;
    const slide=document.getElementById('slide');
    function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function jsonp(){return new Promise((resolve,reject)=>{const cb='macroDash_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script'),timer=setTimeout(()=>done(new Error('Tiempo agotado')),10000);function done(err){clearTimeout(timer);s.remove();delete window[cb];if(err)reject(err)}window[cb]=data=>{done();resolve(data)};s.src=API+'?'+new URLSearchParams({mode:'results',session:SESSION,callback:cb,_:Date.now()});s.onerror=()=>done(new Error('Sin conexión'));document.body.appendChild(s)})}
    async function refresh(){const btn=document.getElementById('refreshBtn');btn.classList.add('refreshing');try{const data=await jsonp();if(!data.ok)throw new Error(data.error||'Error');rows=data.rows||data.responses||[];participants=Number(data.totalVotes)||countParticipants(rows);connected=true;lastUpdated=new Date();render()}catch(_){connected=false;renderChrome()}finally{btn.classList.remove('refreshing')}}
    function countParticipants(list){return new Set(list.map(r=>r.fingerprint).filter(Boolean)).size}
    function questionRows(q){return rows.filter(r=>r.questionId===q.id&&r.session===SESSION)}
    function countsFor(q){const counts={};questionRows(q).forEach(r=>counts[r.answer]=(counts[r.answer]||0)+1);return counts}
    function majorityFor(q){const counts=countsFor(q),entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);return entries[0]||['Sin respuestas',0]}
    function assess(q){const [label,value]=majorityFor(q),total=questionRows(q).length,pct=total?Math.round(value/total*100):0;if(!total)return{kind:'waiting',icon:'…',title:'Esperando respuestas',label:'Aún sin datos',pct:0};if(!q.aligned)return{kind:'neutral',icon:'≈',title:'Sin respuesta única',label,pct};if(q.aligned.includes(label))return{kind:'aligned',icon:'✓',title:'Mayoría alineada',label,pct};return{kind:'review',icon:'!',title:'Intuición por revisar',label,pct}}
    function render(){slide.className='slide';if(current===0)renderCover();else if(current<=QUESTIONS.length)renderQuestion(QUESTIONS[current-1],current-1);else renderSummary();renderChrome()}
    function renderCover(){const completed=rows.length,answered=QUESTIONS.filter(q=>questionRows(q).length>0).length;slide.innerHTML='<div class="cover"><section class="hero"><span class="tag">Resultados en vivo · '+escapeHtml(SESSION)+'</span><h1>¿Cómo piensa este curso?</h1><p>Nueve decisiones para comenzar a leer la economía real: percepciones, intuiciones y dilemas que abrirán nuestra conversación.</p><button class="start-btn" id="startBtn">Explorar resultados →</button></section><aside class="overview"><article class="stat accent"><span>Participantes</span><strong>'+participants+'</strong><small>votaciones completas</small></article><article class="stat"><span>Respuestas registradas</span><strong>'+completed+'</strong><small>filas consolidadas</small></article><article class="stat"><span>Preguntas con datos</span><strong>'+answered+' / 9</strong><small>actualización automática</small></article></aside></div>';document.getElementById('startBtn').onclick=()=>go(1)}
    function renderQuestion(q,index){const qrows=questionRows(q),total=qrows.length,assessment=assess(q),counts=countsFor(q);let content;if(q.type==='word'){const words=Object.entries(counts).sort((a,b)=>b[1]-a[1]);content=words.length?'<div class="cloud">'+words.slice(0,28).map((x,i)=>'<span style="font-size:'+Math.min(2.4,.8+x[1]*.22)+'rem;color:'+COLORS[i%COLORS.length]+'">'+escapeHtml(x[0])+'</span>').join('')+'</div>':'<div class="empty">Aún no hay palabras para mostrar.</div>'}else{const max=Math.max(1,...q.options.map(o=>counts[o]||0));content='<div class="bars">'+q.options.map((o,i)=>{const n=counts[o]||0,p=total?Math.round(n/total*100):0,major=n===max&&n>0;return'<div class="bar-row '+(major?'majority':'')+'"><div class="bar-label"><span>'+escapeHtml(o)+'</span><strong>'+p+'%</strong></div><div class="rail"><b style="width:'+(total?n/max*100:0)+'%;background:'+(major?'':COLORS[i%COLORS.length])+'"></b></div><small>'+n+'</small></div>'}).join('')+'</div>'}slide.innerHTML='<div class="question-slide"><section class="question-card" data-num="'+String(index+1).padStart(2,'0')+'"><p class="q-kicker">'+escapeHtml(q.kicker)+'</p><h2>'+escapeHtml(q.prompt)+'</h2><div class="concept"><span>Concepto que abre</span><strong>'+escapeHtml(q.concept)+'</strong></div><div class="reference">'+escapeHtml(q.reference)+'</div></section><section class="results-card"><header class="result-head"><div><p>Distribución del curso</p><h3>Resultados de la votación</h3></div><span class="answer-total">'+total+' respuestas</span></header><div class="result-content">'+content+'<aside class="assessment '+assessment.kind+'"><div class="assessment-icon">'+assessment.icon+'</div><small>Lectura del grupo</small><h4>'+assessment.title+'</h4><div class="majority-value">'+assessment.pct+'%</div><p><strong>'+escapeHtml(assessment.label)+'</strong></p><p>'+escapeHtml(q.insight)+'</p></aside></div></section><aside class="debate-card"><div class="debate-icon">?</div><span>Pregunta para debatir</span><p>'+escapeHtml(q.debate)+'</p></aside></div>'}
    function renderSummary(){const evaluated=QUESTIONS.filter(q=>q.aligned),items=evaluated.map(q=>({q,a:assess(q)})),aligned=items.filter(x=>x.a.kind==='aligned').length;slide.innerHTML='<div class="summary"><section class="summary-score"><div class="big">'+aligned+'/'+evaluated.length+'</div><h2>Mayorías alineadas</h2><p>Este resultado es diagnóstico, no una calificación. Muestra dónde el curso ya posee intuiciones económicas útiles y dónde conviene detenerse a conversar.</p></section><section class="summary-list"><p>Lectura final</p><h3>Las intuiciones del curso</h3><div class="summary-items">'+items.map((x,i)=>'<div class="summary-item '+x.a.kind+'"><span>'+x.a.icon+'</span><div><strong>'+escapeHtml(x.q.kicker)+'</strong><br><small>'+escapeHtml(x.a.label)+'</small></div><b>'+x.a.pct+'%</b></div>').join('')+'</div></section></div>'}
    function renderChrome(){document.getElementById('topParticipants').textContent=participants;const live=document.getElementById('live');live.className='live'+(connected?' ok':'');live.querySelector('span').textContent=connected?'En vivo · '+(lastUpdated?lastUpdated.toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'}):''):'Sin conexión';document.getElementById('slideLabel').textContent=current===0?'Portada':current<=9?'Pregunta '+current+' de 9':'Síntesis';document.getElementById('prevBtn').disabled=current===0;document.getElementById('nextBtn').disabled=current===10;document.getElementById('dots').innerHTML=Array.from({length:11},(_,i)=>'<button class="dot '+(i===current?'active':'')+'" data-slide="'+i+'" aria-label="Diapositiva '+(i+1)+'"></button>').join('');document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>go(Number(b.dataset.slide)))}
    function go(n){current=Math.max(0,Math.min(10,n));render()}
    document.getElementById('prevBtn').onclick=()=>go(current-1);document.getElementById('nextBtn').onclick=()=>go(current+1);document.getElementById('refreshBtn').onclick=refresh;document.getElementById('fullscreenBtn').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(current-1)}if(e.key==='Home')go(0);if(e.key==='End')go(10);if(e.key.toLowerCase()==='r')refresh();if(e.key.toLowerCase()==='f')document.getElementById('fullscreenBtn').click()});
    render();refresh();setInterval(refresh,5000);
  </script>
</body>
</html>
